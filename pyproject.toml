[project]
name = "subrunner"
version = "0.1.0"
description = "A lightweight Python wrapper for subprocess with Rich logging"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "YeCodeAI", email = "yehor.code@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "build>=1.6.1",
    "rich>=15.0.0",
    "twine>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = []
